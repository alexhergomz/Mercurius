# Self-distillation: the teacher is the student's own original weights (no separate teacher model or server).
# Cheapest way to convert a new model: the surgery is repaired toward the unmodified original.
run:
  name: self-0.8b
student:
  model: Qwen/Qwen3.5-0.8B
teachers:
  - kind: hf
    model: student
convert:
  mla: {budget: 1024, rank_multiple: 128, min_rank: 128}
data:
  text: data/fineweb_edu_long_v2.txt
  eval_text: data/wikitext.txt
  seq: 4096
train:
  steps: 1500
  eval_every: 250
qat:
  start_step: 1000
