# Mercurius-1-Perihelion-9B: Qwen3.5-9B student (8 attention layers, 4 KV heads, head_dim 256), same teacher.
run:
  name: perihelion-9b
student:
  model: Qwen/Qwen3.5-9B
teachers:
  - kind: server
    url: http://127.0.0.1:8077
    gguf: models/Qwen3.5-35B-A3B-Q4_K_M.gguf
convert:
  mla: {budget: 4096, rank_multiple: 128, n_rope: 1}
data:
  text: data/fineweb_edu_long_v2.txt
  episodes: {path: data/episodes/pilot_mix.decon.jsonl, frac: 0.29}
  math: {path: data/math/math_final.decon.jsonl, frac: 0.16}
  eval_text: data/wikitext.txt
  seq: 8192
  length_mix: {4096: 0.318, 8192: 0.629, 32768: 0.053}
train:
  steps: 6300
  eval_every: 525
  guards: {mem_cap_gb: 80}
qat:
  start_step: 4200
