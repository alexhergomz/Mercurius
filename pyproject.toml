[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercurius"
version = "0.2.0"
description = "Convert hybrid language models to long-context, low-memory form (GDN-2, absorbable MLA) and distill them back with quantization-aware training"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# torch is not pinned: Jetson / GB10 wheels come from NVIDIA's index.
dependencies = [
    "torch>=2.4",
    "transformers>=5.6",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
# fla: the fused GDN-2 / causal-conv Triton kernels (without it the PyTorch reference path runs: slow, CPU-capable)
kernels = ["flash-linear-attention>=0.5"]
# gguf: read a llama.cpp teacher's output head; bitsandbytes: nf4 teachers and the legacy NF4 format
teachers = ["gguf>=0.10", "bitsandbytes>=0.43"]
monitor = ["nvidia-ml-py"]
test = ["pytest>=8"]

[project.scripts]
mercurius = "mercurius.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
